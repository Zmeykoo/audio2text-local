[project]
name = "audio2text-local"
version = "0.2.0"
description = "Local audio transcription with Whisper and CUDA acceleration"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "python-dotenv>=1.2.4",
    # DL frameworks
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "accelerate>=1.15.0",
    "tqdm>=4.70.1",
    # converters
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2; python_version >= '3.13'", # pydub needs audioop, removed from stdlib in 3.13
    "librosa>=1.0.0",
]

[dependency-groups]
dev = ["pre-commit>=4.0", "black>=25.0"]

# On Linux pull CUDA-enabled torch wheels; on macOS use the default PyPI build (MPS/CPU).
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

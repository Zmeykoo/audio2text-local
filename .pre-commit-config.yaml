repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
    -   id: black
-   repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
    -   id: uv-lock
